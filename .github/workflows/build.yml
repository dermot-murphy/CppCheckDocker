name: Build, Test, and Publish

on:
  push:
    branches: [main, develop, "feature/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]

env:
  CPPCHECK_VERSION: "2.21.1"
  UBUNTU_VERSION: "24.04"
  IMAGE_NAME: cppcheck
  IMAGE_TAG: ci

jobs:
  Lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --show-diff-on-failure --color=always --all-files

  Build-Image:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          build-args: |
            CPPCHECK_VERSION=${{ env.CPPCHECK_VERSION }}
            UBUNTU_VERSION=${{ env.UBUNTU_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record image size
        run: |
          size=$(docker image inspect ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} --format '{{.Size}}')
          human=$(numfmt --to=iec --suffix=B "$size")
          echo "Image size: $human ($size bytes)"
          echo "IMAGE_SIZE_BYTES=$size" >> "$GITHUB_ENV"

      # SR-060: runtime image <= 200 MB. Fail the build on regression so an
      # accidental size blow-up cannot merge. See CCD-SUP1-001 §3 gate row
      # "Image size regression" and audit finding FIND-A in
      # documents/aspice/CppCheckDocker_AUD_2026-08-13_ASPICE_L2_Audit.md.
      - name: Fail on image size regression (SR-060)
        env:
          MAX_MB: '200'
        run: |
          max_bytes=$((MAX_MB * 1024 * 1024))
          if [ "$IMAGE_SIZE_BYTES" -gt "$max_bytes" ]; then
            human=$(numfmt --to=iec --suffix=B "$IMAGE_SIZE_BYTES")
            echo "::error::Image size $human ($IMAGE_SIZE_BYTES bytes) exceeds SR-060 threshold of ${MAX_MB} MB. Investigate before merge."
            exit 1
          fi
          echo "::notice::Image size ($IMAGE_SIZE_BYTES bytes) is within the SR-060 ${MAX_MB} MB threshold."

      - name: Export image to artifact
        run: docker save "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" -o /tmp/image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v6
        with:
          name: cppcheck-image
          path: /tmp/image.tar
          retention-days: 7

  Verify-Version:
    name: Verify cppcheck version
    needs: Build-Image
    runs-on: ubuntu-latest
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v7
        with:
          name: cppcheck-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/image.tar

      - name: cppcheck --version matches pinned version
        run: |
          actual=$(docker run --rm ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} --version)
          expected="Cppcheck ${{ env.CPPCHECK_VERSION }}"
          echo "actual:   $actual"
          echo "expected: $expected"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Version mismatch — expected '$expected', got '$actual'"
            exit 1
          fi

  Run-Integration-Tests:
    name: Run integration tests
    needs: Build-Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download image artifact
        uses: actions/download-artifact@v7
        with:
          name: cppcheck-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/image.tar

      - name: Execute integration test harness
        run: |
          chmod +x test/integration/run.sh
          test/integration/run.sh ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} | tee /tmp/integration.log

      - name: Upload integration test log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Integration_Test_Output
          path: /tmp/integration.log
          retention-days: 30

  Scan-Image:
    name: Scan image for CVEs
    needs: Build-Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download image artifact
        uses: actions/download-artifact@v7
        with:
          name: cppcheck-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/image.tar

      - name: Scan image (informational report, all severities)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: table
          output: /tmp/trivy-report.txt
          severity: LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: false
          trivyignores: .trivyignore
        env:
          TRIVY_DISABLE_VEX_NOTICE: 'true'

      - name: Print scan report
        run: cat /tmp/trivy-report.txt

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Image_Scan_Report
          path: /tmp/trivy-report.txt
          retention-days: 90

      - name: Fail on HIGH or CRITICAL CVEs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          trivyignores: .trivyignore
        env:
          TRIVY_DISABLE_VEX_NOTICE: 'true'

  Release:
    name: Release image to GHCR and DockerHub
    needs: [Verify-Version, Run-Integration-Tests, Scan-Image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      GHCR_REPO: ghcr.io/${{ github.repository }}
      DOCKERHUB_REPO: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/cppcheckdocker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Skip publish when the merged push touches no image-affecting files.
      # See CCD-SPL2-001 §5.1 and CCD-SUP8-001 §5.3. Issue #24.
      - name: Detect image-affecting changes
        id: filter
        uses: dorny/paths-filter@v3.0.4
        with:
          filters: |
            image:
              - 'Dockerfile'
              - '.dockerignore'
              - 'documents/assets/misra_c_2012_for_cppcheck.txt'
              - '.github/workflows/build.yml'

      - name: Skip release (no image-affecting changes)
        if: steps.filter.outputs.image != 'true'
        run: |
          echo "::notice::No image-affecting files changed on this push to main; skipping publish per CCD-SPL2-001 §5.1."

      - name: Set up Docker Buildx
        if: steps.filter.outputs.image == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Lowercase repository owner (GHCR requires lowercase)
        if: steps.filter.outputs.image == 'true'
        id: repo
        run: |
          lower_repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "ghcr=ghcr.io/${lower_repo}" >> "$GITHUB_OUTPUT"

      - name: Compute revision suffix
        if: steps.filter.outputs.image == 'true'
        id: rev
        env:
          VERSION: ${{ env.CPPCHECK_VERSION }}
        run: |
          # Count existing v<VERSION>-r<N> git tags and take the next N.
          existing=$(git tag --list "v${VERSION}-r*" | wc -l)
          revision=$((existing + 1))
          tag="${VERSION}-r${revision}"
          git_tag="v${tag}"
          echo "revision=${revision}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "git_tag=${git_tag}" >> "$GITHUB_OUTPUT"
          echo "Computed image tag: ${tag}"
          echo "Computed git tag:  ${git_tag}"

      - name: Log in to GHCR
        if: steps.filter.outputs.image == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to DockerHub
        if: steps.filter.outputs.image == 'true'
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image (multi-registry, immutable + latest)
        if: steps.filter.outputs.image == 'true'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.repo.outputs.ghcr }}:${{ steps.rev.outputs.tag }}
            ${{ steps.repo.outputs.ghcr }}:latest
            ${{ env.DOCKERHUB_REPO }}:${{ steps.rev.outputs.tag }}
            ${{ env.DOCKERHUB_REPO }}:latest
          build-args: |
            CPPCHECK_VERSION=${{ env.CPPCHECK_VERSION }}
            UBUNTU_VERSION=${{ env.UBUNTU_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create annotated git tag
        if: steps.filter.outputs.image == 'true'
        env:
          GIT_TAG: ${{ steps.rev.outputs.git_tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${GIT_TAG}" -m "Release ${GIT_TAG}"
          git push origin "${GIT_TAG}"

      - name: Create GitHub Release
        if: steps.filter.outputs.image == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_TAG: ${{ steps.rev.outputs.git_tag }}
          IMAGE_TAG_ID: ${{ steps.rev.outputs.tag }}
          DIGEST: ${{ steps.push.outputs.digest }}
          GHCR_REPO_LOWER: ${{ steps.repo.outputs.ghcr }}
        run: |
          notes=$(cat <<EOF
          ## CppCheckDocker ${IMAGE_TAG_ID}

          Automated release from commit \`${GITHUB_SHA::7}\` on branch \`main\`.

          ### Published image tags

          | Registry | Tag | Immutable digest |
          |:---------|:----|:-----------------|
          | GHCR | \`${GHCR_REPO_LOWER}:${IMAGE_TAG_ID}\` | \`${DIGEST}\` |
          | GHCR | \`${GHCR_REPO_LOWER}:latest\` | \`${DIGEST}\` |
          | DockerHub | \`${DOCKERHUB_REPO}:${IMAGE_TAG_ID}\` | \`${DIGEST}\` |
          | DockerHub | \`${DOCKERHUB_REPO}:latest\` | \`${DIGEST}\` |

          ### Pull

          \`\`\`bash
          docker pull ${GHCR_REPO_LOWER}:${IMAGE_TAG_ID}
          docker pull ${DOCKERHUB_REPO}:${IMAGE_TAG_ID}
          \`\`\`

          ### Contents

          - cppcheck \`${CPPCHECK_VERSION}\` on \`ubuntu:${UBUNTU_VERSION}\`
          - MISRA C:2012 rule-texts bundled (CC BY-NC-ND 4.0)
          - Non-root \`cppcheck\` user; \`ENTRYPOINT ["cppcheck"]\`

          The Software Version Description (SVD) for this release will be added under \`documents/aspice/records/CCD-SVD-${IMAGE_TAG_ID}.md\` and linked back to these notes.
          EOF
          )
          gh release create "${GIT_TAG}" \
            --title "CppCheckDocker ${IMAGE_TAG_ID}" \
            --notes "${notes}"

      # CCD-SUP8-001 §7 Configuration Audit - closes FIND-D from
      # CCD-AUD-2026-08-13-L2. Verifies that the tag we just pushed resolves,
      # in each registry, back to the digest reported by the build-push step,
      # and that cppcheck --version in the published image matches the pinned
      # ARG. Fails the release on any mismatch.
      - name: Configuration audit - registry digest round-trip (SUP.8 §7)
        if: steps.filter.outputs.image == 'true'
        env:
          GHCR_TAG: ${{ steps.repo.outputs.ghcr }}:${{ steps.rev.outputs.tag }}
          DOCKERHUB_TAG: ${{ env.DOCKERHUB_REPO }}:${{ steps.rev.outputs.tag }}
          PUSH_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -e
          echo "Verifying registries resolve tag to pushed digest: $PUSH_DIGEST"
          fail=0
          for tag_ref in "$GHCR_TAG" "$DOCKERHUB_TAG"; do
            observed=$(docker buildx imagetools inspect "$tag_ref" --format '{{.Manifest.Digest}}')
            echo "  $tag_ref -> $observed"
            if [ "$observed" != "$PUSH_DIGEST" ]; then
              echo "::error::Digest mismatch at $tag_ref: expected $PUSH_DIGEST, got $observed"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "::notice::Configuration audit (digest round-trip) passed: both registries resolve $PUSH_DIGEST for tag ${{ steps.rev.outputs.tag }}."

      - name: Configuration audit - version smoke on published image (SUP.8 §7)
        if: steps.filter.outputs.image == 'true'
        env:
          GHCR_TAG: ${{ steps.repo.outputs.ghcr }}:${{ steps.rev.outputs.tag }}
        run: |
          set -e
          pulled=$(docker run --rm "$GHCR_TAG" --version)
          expected="Cppcheck ${{ env.CPPCHECK_VERSION }}"
          echo "Pulled : $pulled"
          echo "Expected: $expected"
          if [ "$pulled" != "$expected" ]; then
            echo "::error::Published image version mismatch: expected '$expected', got '$pulled'"
            exit 1
          fi
          echo "::notice::Configuration audit (version smoke on published image) passed."

  Publish-Wiki:
    name: Publish User Guide and ASPICE documents to Wiki
    needs: [Verify-Version, Run-Integration-Tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Clone wiki
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          if [ -z "${WIKI_TOKEN}" ]; then
            echo "::error::WIKI_TOKEN secret is not set. See documents/aspice/CppCheckDocker_SUP8_CM_Plan.md §5.4 for setup instructions."
            exit 1
          fi
          git clone "https://x-access-token:${WIKI_TOKEN}@github.com/${{ github.repository }}.wiki.git" wiki

      # Wipe wiki contents so removed source docs disappear from the wiki. The
      # .git dir is preserved; a follow-up `git add -A` re-adds every generated
      # file and stages the deletions in one commit.
      - name: Reset wiki working tree
        working-directory: wiki
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

      - name: Regenerate wiki content
        run: |
          python scripts/generate_wiki.py \
            --repo . \
            --wiki wiki \
            --ref "${GITHUB_REF_NAME}" \
            --sha "${GITHUB_SHA}"

      - name: Commit and push wiki
        working-directory: wiki
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No wiki changes to publish."
            exit 0
          fi
          git commit -m "Sync wiki from ${GITHUB_REF_NAME}@${GITHUB_SHA::7}"
          git push origin HEAD:master

  AllChecksPassed:
    name: All checks passed
    needs: [Lint, Verify-Version, Run-Integration-Tests, Scan-Image]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All required checks passed."
